<script>

/* ====== CORAZONES ====== */
function createHeart(){
let heart=document.createElement("div");
heart.className="shootingHeart";
heart.innerHTML="💖";
heart.style.left=Math.random()*window.innerWidth+"px";
heart.style.top=Math.random()*window.innerHeight/2+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),5000);
}
setInterval(createHeart,1000);

/* ====== FRASES NO ====== */
let warnings=[
"¿Segura?",
"ja que tontaaaa 😜",
"imposibleeee",
"one two tree 🌳",
"hasta luego lucas",
"soy tu grano favorito",
"😗 silbando...",
"que no pesadaaa",
"vengaaaa casi",
"tu puedes 💪",
"última oportunidad",
"❌ Error 404"
];

let count=0;
let activeMessages=0;

const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");

noBtn.addEventListener("click",()=>{

if(count < warnings.length){

let box=document.createElement("div");
box.className="messageBox";
box.innerHTML=`<button class="closeBtn">X</button>${warnings[count]}`;

box.style.top=Math.random()*60+20+"%";
box.style.left=Math.random()*60+20+"%";

document.body.appendChild(box);
activeMessages++;

box.querySelector(".closeBtn").onclick=()=>{
box.remove();
activeMessages--;

if(warnings[count-1]==="❌ Error 404" && activeMessages===0){
showBigYes();
}
};

noBtn.style.transform=`translate(${Math.random()*150-75}px, ${Math.random()*150-75}px) scale(${1 - count*0.06})`;

if(warnings[count]==="❌ Error 404"){
noBtn.style.display="none";
}

count++;

}

});

/* ====== FUNCION FINAL ====== */
function startLoveSequence(){

document.body.innerHTML="<div class='stars'></div>";

let msg=document.createElement("h1");
msg.innerText="Sabía que ibas a decir que sí ❤️";
msg.style.marginTop="40vh";
document.body.appendChild(msg);

/* Vibración compatible */
if(navigator.vibrate){
navigator.vibrate([200,100,200]);
}

setTimeout(()=>{
msg.remove();
showCountdown();
},3000);

}

/* ====== TEMPORIZADOR ====== */
function showCountdown(){

let container=document.createElement("div");
container.style.marginTop="35vh";
container.style.fontSize="28px";
container.id="countdown";
document.body.appendChild(container);

let target=new Date();
target.setDate(target.getDate() + ((5 - target.getDay() + 7) % 7)); // próximo viernes
target.setHours(14,0,0,0);

let interval=setInterval(()=>{
let now=new Date();
let diff=target-now;

if(diff<=0){
clearInterval(interval);
container.innerHTML="Espera impaciente ❤️";

if(navigator.vibrate){
navigator.vibrate([300,100,300,100,300]);
}

return;
}

let days=Math.floor(diff/(1000*60*60*24));
let hours=Math.floor((diff/(1000*60*60))%24);
let minutes=Math.floor((diff/1000/60)%60);
let seconds=Math.floor((diff/1000)%60);

container.innerHTML=
`${days}d ${hours}h ${minutes}m ${seconds}s ❤️`;

},1000);

}

/* ====== SI GIGANTE ====== */
function showBigYes(){
document.body.innerHTML="<div class='stars'></div>";
let big=document.createElement("div");
big.className="bigYes";
big.innerText="SÍ ❤️";
big.onclick=startLoveSequence;
document.body.appendChild(big);
}

/* ====== SI NORMAL ====== */
yesBtn.addEventListener("click",startLoveSequence);

</script>
