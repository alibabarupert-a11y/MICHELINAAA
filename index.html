<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Michelina ❤️</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            text-align: center;
            background: radial-gradient(ellipse at bottom, #0d0d1a 0%, #000000 100%);
            touch-action: manipulation;
        }

        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(1px 1px at 70% 80%, white, transparent),
                radial-gradient(2px 2px at 40% 60%, white, transparent),
                radial-gradient(1px 1px at 90% 10%, white, transparent);
            background-repeat: repeat;
            background-size: 300px 300px;
            animation: moveStars 80s linear infinite;
            z-index: 0;
        }

        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: -1000px 1000px; }
        }

        .container {
            position: relative;
            z-index: 5;
            top: 15vh;
            padding: 10px;
        }

        h1 {
            font-size: 24px;
            line-height: 1.3;
            text-shadow: 0 0 20px #ff4da6;
            margin-bottom: 40px;
        }

        /* Título Feliz San Valentín en Rojo */
        .happy-title {
            color: #ff0000;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 20px #ff0000, 2px 2px 5px black;
            margin-top: 20px;
            animation: heartbeat 1.5s infinite;
        }

        .minecraft-splash {
            display: block;
            color: #ffff00;
            font-weight: bold;
            font-size: 22px;
            text-shadow: 2px 2px 0px #3f3f00;
            transform: rotate(-15deg);
            animation: splash-anim 0.5s infinite alternate;
            margin: 10px auto;
            width: fit-content;
            pointer-events: none;
        }

        @keyframes splash-anim {
            from { transform: rotate(-15deg) scale(1); }
            to { transform: rotate(-15deg) scale(1.15); }
        }

        #yes {
            position: relative;
            background: #ff2e88;
            color: white;
            box-shadow: 0 0 20px #ff2e88;
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            z-index: 10;
        }

        #no {
            position: absolute;
            left: 50%;
            top: 70px;
            transform: translateX(-50%);
            background: #222;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }

        .shootingHeart {
            position: fixed;
            font-size: 20px;
            z-index: 2;
            animation: shoot 4s linear forwards;
        }

        @keyframes shoot {
            0% { transform: translate(0, 0); opacity: 1; }
            100% { transform: translate(-800px, 800px); opacity: 0; }
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        #countdown {
            position: fixed;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            width: 90%;
            text-shadow: 0 0 20px #ff2e88;
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div id="main-content" class="container">
        <h1>Michelina ❤️<br>¿Quieres celebrar San Valentín<br>con tu negro? ❤️</h1>
        <div id="splash" class="minecraft-splash">¿No lo ves o qué? 🤨</div>
        <div class="buttons">
            <button id="yes">Sí ❤️</button>
            <button id="no">No ❌</button>
        </div>
    </div>

    <script>
        // Lógica de corazones y splashes igual que antes...
        function createHeart() {
            let heart = document.createElement("div");
            heart.className = "shootingHeart";
            heart.innerHTML = "💖";
            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.top = Math.random() * window.innerHeight / 2 + "px";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }
        setInterval(createHeart, 800);

        const splashes = ["¿No lo ves o qué? 🤨", "¡Nivel de amor: MAX! 🎮", "¡Pícame el corazón! ⛏️", "¡Eres mi bioma favorito! 🌲"];
        setInterval(() => {
            const splashEl = document.getElementById("splash");
            if(splashEl) splashEl.innerText = splashes[Math.floor(Math.random() * splashes.length)];
        }, 2000);

        // Lógica del botón NO (simplificada para el ejemplo)
        const noBtn = document.getElementById("no");
        noBtn.addEventListener("mouseover", () => {
            noBtn.style.left = Math.random() * (window.innerWidth - 100) + "px";
            noBtn.style.top = Math.random() * (window.innerHeight - 100) + "px";
            noBtn.style.position = "fixed";
        });

        // AL PULSAR SÍ
        document.getElementById("yes").onclick = function() {
            document.body.innerHTML = `
                <div class="stars"></div>
                <div class="container">
                    <div class="happy-title">❤️FELIZ SAN VALENTÍN❤️</div>
                    <div id="countdown">Cargando momento especial...</div>
                </div>`;
            startCountdown();
        };

        function startCountdown() {
            const countdownEl = document.getElementById("countdown");
            function update() {
                let now = new Date();
                let target = new Date();
                let daysUntilFriday = (5 - now.getDay() + 7) % 7;
                if (daysUntilFriday === 0 && now.getHours() >= 14) daysUntilFriday = 7;
                target.setDate(now.getDate() + daysUntilFriday);
                target.setHours(14, 0, 0, 0);

                let distance = target - now;
                if (distance <= 0) {
                    countdownEl.innerHTML = "<br><br><span style='font-size:30px'>Esperaaa aun nooo cabezona 😂❤️</span>";
                    return;
                }

                let d = Math.floor(distance / 86400000);
                let h = Math.floor((distance % 86400000) / 3600000);
                let m = Math.floor((distance % 3600000) / 60000);
                let s = Math.floor((distance % 60000) / 1000);
                countdownEl.innerHTML = `Faltan para nuestra cita:<br><br><b style="font-size:32px">${d}d ${h}h ${m}m ${s}s</b>`;
            }
            setInterval(update, 1000);
            update();
        }
    </script>
</body>
</html>
