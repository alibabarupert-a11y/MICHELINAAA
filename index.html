<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Michelina ❤️</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial, sans-serif;
background:black;
color:white;
text-align:center;
}

/* Fondo galaxia real */
#stars{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
z-index:0;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:0.2;}
to{opacity:1;}
}

.container{
position:relative;
top:30vh;
z-index:2;
}

button{
padding:15px 30px;
font-size:18px;
margin:10px;
border:none;
border-radius:30px;
cursor:pointer;
transition:0.3s;
}

#yes{
background:#ff4d88;
color:white;
}

#no{
background:#444;
color:white;
position:absolute;
}

.bigYes{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:60px;
background:#ff1a75;
padding:40px 80px;
border-radius:50px;
z-index:5;
animation:heartbeat 1s infinite;
}

@keyframes heartbeat{
0%{transform:translate(-50%,-50%) scale(1);}
25%{transform:translate(-50%,-50%) scale(1.1);}
50%{transform:translate(-50%,-50%) scale(1);}
75%{transform:translate(-50%,-50%) scale(1.15);}
100%{transform:translate(-50%,-50%) scale(1);}
}

.messageBox{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:20px;
border-radius:20px;
border:2px solid #ff4d88;
z-index:10;
}

.closeBtn{
cursor:pointer;
font-weight:bold;
display:block;
margin-top:10px;
}
</style>
</head>

<body>

<div id="stars"></div>

<div class="container" id="main">
<h1>Michelina mi negro ❤️<br>¿Quieres celebrar San Valentín conmigo?</h1>
<button id="yes">Sí ❤️</button>
<button id="no">No ❌</button>
</div>

<audio id="music">
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_6bfe6b3d9d.mp3" type="audio/mpeg">
</audio>

<audio id="noSound">
<source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_7d1e7b4f02.mp3" type="audio/mpeg">
</audio>

<script>

const starsContainer = document.getElementById("stars");
for(let i=0;i<200;i++){
let star=document.createElement("div");
star.className="star";
star.style.top=Math.random()*100+"%";
star.style.left=Math.random()*100+"%";
starsContainer.appendChild(star);
}

const yesBtn=document.getElementById("yes");
const noBtn=document.getElementById("no");
const music=document.getElementById("music");
const noSound=document.getElementById("noSound");

let warnings=[
"⚠️ ¿Segura? Esto será MUY romántico...",
"💥 Peligro: abrazos infinitos",
"🚨 Riesgo alto de besos",
"❌ Última oportunidad...",
"Error 404: opción 'No' no disponible"
];

let clickCount=0;

noBtn.addEventListener("click",()=>{

noSound.play();

if(clickCount<warnings.length){

let box=document.createElement("div");
box.className="messageBox";
box.innerHTML=`<p>${warnings[clickCount]}</p>
<button class="closeBtn">Cerrar</button>`;
document.body.appendChild(box);

box.querySelector(".closeBtn").onclick=()=>{
box.remove();
};

noBtn.style.top=Math.random()*80+"%";
noBtn.style.left=Math.random()*80+"%";

clickCount++;

}else{

document.body.innerHTML="";
let big=document.createElement("div");
big.className="bigYes";
big.innerText="SÍ ❤️";
document.body.appendChild(big);

big.addEventListener("click",()=>{
document.body.innerHTML="<h1 style='margin-top:40vh;'>Sabía que dirías que sí ❤️</h1>";
createHearts();
music.play();
});

}
});

yesBtn.addEventListener("click",()=>{

music.play();

document.getElementById("main").innerHTML="<h1>Sabía que dirías que sí ❤️</h1>";
createHearts();

});

function createHearts(){
for(let i=0;i<40;i++){
let heart=document.createElement("div");
heart.innerHTML="💖";
heart.style.position="fixed";
heart.style.left=Math.random()*100+"%";
heart.style.top="-10px";
heart.style.fontSize=Math.random()*20+20+"px";
heart.style.animation="fall 3s linear";
document.body.appendChild(heart);

setTimeout(()=>heart.remove(),3000);
}
}

const style=document.createElement("style");
style.innerHTML=`
@keyframes fall{
to{transform:translateY(100vh);}
}
`;
document.head.appendChild(style);

</script>

</body>
</html>
