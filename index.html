<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Para Michelina ❤️</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:'Segoe UI', sans-serif;
color:white;
text-align:center;
background: radial-gradient(ellipse at bottom, #0d0d1a 0%, #000000 100%);
touch-action: manipulation;
}

.stars{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(2px 2px at 20% 30%, white, transparent),
radial-gradient(1px 1px at 70% 80%, white, transparent),
radial-gradient(2px 2px at 40% 60%, white, transparent),
radial-gradient(1px 1px at 90% 10%, white, transparent);
background-repeat:repeat;
background-size:300px 300px;
animation:moveStars 80s linear infinite;
z-index:0;
}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:-1000px 1000px;}
}

.container{
position:relative;
z-index:5;
top:15vh;
padding:10px;
}

h1{
font-size:24px;
line-height:1.3;
text-shadow:0 0 20px #ff4da6;
}

.buttons{
margin-top:20px;
position:relative;
display: inline-block;
}

#minecraftSplash {
    position: absolute;
    top: -25px;
    right: -30px;
    color: #ffff00;
    font-weight: bold;
    font-size: 18px;
    text-shadow: 2px 2px #3f3f00;
    transform: rotate(-20deg);
    z-index: 100;
    pointer-events: none;
    white-space: nowrap;
    animation: mc-pulse 0.5s infinite alternate;
}

@keyframes mc-pulse {
    from { transform: rotate(-20deg) scale(1); }
    to { transform: rotate(-20deg) scale(1.1); }
}

#yes{
position:relative;
background:#ff2e88;
color:white;
box-shadow:0 0 20px #ff2e88;
padding:12px 30px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
}

#no{
position:absolute;
left:50%;
top:70px;
transform: translateX(-50%);
background:#222;
color:white;
padding:12px 30px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
white-space: nowrap;
}

.messageBox{
position:fixed;
background:#111;
padding:25px;
border-radius:20px;
border:3px solid #ff2e88;
z-index:9999;
font-size:18px;
width: 200px;
box-shadow:0 0 30px #ff2e88;
cursor: pointer;
}

.closeBtn{
position:absolute;
top:5px;
right:10px;
background:none;
border:none;
color:#ff2e88;
font-size:16px;
}

/* ESTILO CONFETI CORAZONES */
.confetti {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    animation: fall linear forwards;
}

@keyframes fall {
    to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}

#countdown{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:24px;
width: 90%;
text-shadow:0 0 20px #ff4da6;
z-index: 10;
}
</style>
</head>

<body>
<div class="stars"></div>

<div class="container">
<h1>Michelina ❤️<br>¿Quieres celebrar San Valentín<br>conmigo? ❤️</h1>
<div class="buttons">
<button id="yes">Sí ❤️</button>
<button id="no">No ❌</button>
<div id="minecraftSplash">¿No lo ves?</div>
</div>
</div>

<script>
let warnings=["⚠️ ¿Segura?", "ja ja que tontaaaa 😜", "imposibleeee", "one two tree 🌳", "hasta luego lucas 😏", "soy tu grano favorito", "😗 silbando...", ".........", "que no pesadaaa 😂", "vengaaaa casi", "tu puedes 💪", "amor detectado 💘", "no puedes escapar 😈", "última advertencia romántica", "❌ Error 404"];
let splashes = ["¿Tan difícil es?", "¿No lo ves?", "¡Dale al SÍ!", "Piénsalo bien...", "¡Esa no es!", "¡Error fatal!", "¿En serio?", "Sigue buscando"];

let count=0;
let activeMessages=0;

const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const splashEl=document.getElementById("minecraftSplash");

noBtn.addEventListener("click",()=>{
if(count < warnings.length){
let box=document.createElement("div");
box.className="messageBox";
box.innerHTML=`<button class="closeBtn">X</button>${warnings[count]}`;

let maxX = window.innerWidth - 240;
let maxY = window.innerHeight - 150;
box.style.left = Math.max(10, Math.random() * maxX) + "px";
box.style.top = Math.max(10, Math.random() * maxY) + "px";

document.body.appendChild(box);
activeMessages++;

box.onclick=()=>{
box.remove();
activeMessages--;
if(warnings[count-1] === "❌ Error 404" && activeMessages === 0){ showBigYes(); }
};

splashEl.innerText = splashes[Math.floor(Math.random() * splashes.length)];
noBtn.style.position = "fixed";
noBtn.style.left = Math.max(10, Math.random() * (window.innerWidth - 100)) + "px";
noBtn.style.top = Math.max(10, Math.random() * (window.innerHeight - 60)) + "px";
noBtn.style.transform="scale("+(1 - count*0.05)+")";
count++;
}
});

function createConfetti() {
    const hearts = ["❤️", "💖", "💝", "💕", "💗"];
    const colors = ["#ff2e88", "#ff4da6", "#ffffff", "#ff0000"];
    for(let i = 0; i < 50; i++) {
        setTimeout(() => {
            const c = document.createElement("div");
            c.className = "confetti";
            c.innerText = hearts[Math.floor(Math.random() * hearts.length)];
            c.style.left = Math.random() * 100 + "vw";
            c.style.top = "-5vh";
            c.style.color = colors[Math.floor(Math.random() * colors.length)];
            c.style.fontSize = Math.random() * 20 + 10 + "px";
            c.style.animationDuration = Math.random() * 3 + 2 + "s";
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 5000);
        }, i * 100);
    }
}

function showBigYes(){
    document.body.innerHTML="<div class='stars'></div>";
    let big=document.createElement("div");
    big.className="bigYes"; // Usará el estilo heartbeat que ya tenías
    big.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:50px;background:#ff2e88;padding:40px 60px;border-radius:50px;z-index:10000;animation:heartbeat 1s infinite;box-shadow:0 0 40px #ff2e88;cursor:pointer;";
    big.innerText="SÍ ❤️";
    document.body.appendChild(big);
    big.onclick = showLoveMessage;
}

yesBtn.onclick = showLoveMessage;

function showLoveMessage(){
    document.body.innerHTML="<div class='stars'></div><div id='countdown'>Sabía que ibas a decir que sí ❤️</div>";
    createConfetti(); // LANZA EL CONFETI
    setTimeout(startCountdown,3000);
}

function startCountdown(){
    document.body.innerHTML="<div class='stars'></div><div id='countdown'></div>";
    let countdown=document.getElementById("countdown");
    let now = new Date();
    let target = new Date();
    let day = now.getDay();
    let daysUntilFriday = (5 - day + 7) % 7;
    if(daysUntilFriday === 0 && now.getHours() >= 14) daysUntilFriday = 7;
    target.setDate(now.getDate() + daysUntilFriday);
    target.setHours(14,0,0,0);

    function update(){
        let nowTime=new Date().getTime();
        let distance=target - nowTime;
        if(distance<=0){ countdown.innerHTML="Espera impaciente ❤️"; return; }
        let d=Math.floor(distance/(1000*60*60*24));
        let h=Math.floor((distance%(1000*60*60*24))/(1000*60*60));
        let m=Math.floor((distance%(1000*60*60))/(1000*60));
        let s=Math.floor((distance%(1000*60))/1000);
        countdown.innerHTML=d+"d "+h+"h "+m+"m "+s+"s ❤️";
    }
    setInterval(update,1000);
    update();
}
</script>
</body>
</html>
