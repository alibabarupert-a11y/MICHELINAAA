<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Para Michelina </title> ❤
<style>
body{
margin:0;
overflow:hidden;
font-family:'Segoe UI', sans-serif;
color:white;
text-align:center;
background: radial-gradient(ellipse at bottom, #0d0d1a 0%, #000000 100%);
}
/* ESTRELLAS */
.stars{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(2px 2px at 20% 30%, white, transparent),
radial-gradient(1px 1px at 70% 80%, white, transparent),
radial-gradient(2px 2px at 40% 60%, white, transparent),
radial-gradient(1px 1px at 90% 10%, white, transparent);
background-repeat:repeat;
background-size:300px 300px;
animation:moveStars 80s linear infinite;
z-index:0;
}
@keyframes moveStars{
from{background-position:0 0;}
to{background-position:-1000px 1000px;}
}
.container{
position:relative;
z-index:5;
top:15vh; /* Ajustado para que el texto no se corte en móviles */
padding:10px;
}
h1{
font-size:24px; /* Tamaño optimizado para que quepa bien en una pantalla móvil */
line-height:1.3;
text-shadow:0 0 20px #ff4da6;
}
.buttons{
margin-top:40px;
position:relative;
display: inline-block;
}
/* EFECTO MINECRAFT SPLASH */
#minecraftSplash {
 position: absolute;
 top: -30px;
 right: -30px;
 color: #ffff00;
 font-weight: bold;
 font-size: 18px;
 text-shadow: 2px 2px #3f3f00;
 transform: rotate(-20deg);
 z-index: 100;
 pointer-events: none;
 animation: mc-pulse 0.5s infinite alternate;
}
@keyframes mc-pulse {
 from { transform: rotate(-20deg) scale(1); }
 to { transform: rotate(-20deg) scale(1.1); }
}
#yes, #no{
padding:12px 30px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
white-space: nowrap;
}
#yes{
position:relative;
background:#ff2e88;
color:white;
box-shadow:0 0 20px #ff2e88;
}
#no{
position:absolute;
left:50%;
top:70px;
transform: translateX(-50%);
background:#222;
color:white;
}
.messageBox{
position:fixed;
background:#111;
padding:25px;
border-radius:20px;
border:3px solid #ff2e88;
z-index:9999;
font-size:18px;
width: 200px;
box-shadow:0 0 30px #ff2e88;
cursor: pointer;
}
/* PANTALLA FINAL */
.finalTitle {
 position: fixed;
 top: 5vh;
 left: 0;
 width: 100%;
 color: #ff0000;
 font-size: 28px;
 font-weight: bold;
 text-shadow: 0 0 15px rgba(255,0,0,0.7);
 z-index: 20;
}
#countdown{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:32px;
width: 90%;
text-shadow:0 0 20px #ff4da6;
z-index: 10;
}
</style>
</head>
<body>
<div class="stars"></div>
<div class="container">
<h1>Michelina <br> ❤ <br> ¿Quieres celebrar San Valentín<br>con tu negro? ❤ </h1>
<div class="buttons">
<button id="yes">Sí </button> ❤
<div id="minecraftSplash">¿No lo ves o qué?</div>
<button id="no">No </button> ❌
</div>
</div>

<script>
let warnings=[" ¿Segura?", "ja ja que tontaaaa ", "imposibleeee", "one two tree ", "hasta luego lucas ", "soy tu grano favorito", " silbando...", ".........", "que no pesadaaa ", "vengaaaa casi", "tu puedes ", "amor detectado ", "no puedes escapar ", "última advertencia romántica", " Error 404"];
let splashes = ["¿No lo ves?", "¡Dale al SÍ!", "¿Tan difícil es?", "¡Error fatal!", "Piénsalo bien...", "¿En serio?"];
let count=0;
let activeMessages=0;
const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const splashEl = document.getElementById("minecraftSplash");

noBtn.addEventListener("click",()=>{
if(count < warnings.length){
let box=document.createElement("div");
box.className="messageBox";
box.innerHTML=warnings[count];
box.style.top=Math.random()*70+"%";
box.style.left=Math.random()*70+"%";
document.body.appendChild(box);
activeMessages++;
box.onclick=()=>{
box.remove();
activeMessages--;
if(warnings[count-1] === " Error 404" && activeMessages === 0){
showBigYes();
}
};
// Cambia el texto del splash al estilo Minecraft
splashEl.innerText = splashes[Math.floor(Math.random() * splashes.length)];
noBtn.style.top=Math.random()*80+"%";
noBtn.style.left=Math.random()*80+"%";
noBtn.style.transform="scale("+(1 - count*0.05)+")";
count++;
}
});

function showBigYes(){
document.body.innerHTML="<div class='stars'></div>";
let big=document.createElement("div");
big.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:50px;background:#ff2e88;padding:40px 60px;border-radius:50px;z-index:10000;animation:pulse 1s infinite;box-shadow:0 0 40px #ff2e88;cursor:pointer;";
big.innerText="SÍ ❤";
document.body.appendChild(big);
big.onclick = showLoveMessage;
}

yesBtn.onclick = showLoveMessage;

function showLoveMessage(){
document.body.innerHTML = "<div class='stars'></div><div class='finalTitle'>FELIZ SAN VALENTÍN AMOR ❤</div><div id='countdown'>Cargando sorpresa...</div>";
startCountdown();
}

function startCountdown(){
let countdown = document.getElementById("countdown");
let target = new Date();
let day = target.getDay();
let daysUntilFriday = (5 - day + 7) % 7;
if(daysUntilFriday === 0 && target.getHours() >= 14) daysUntilFriday = 7;
target.setDate(target.getDate() + daysUntilFriday);
target.setHours(14,0,0,0);

function update(){
let nowTime=new Date().getTime();
let distance=target - nowTime;
if(distance<=0){ countdown.innerHTML="¡Es hoy! ❤"; return; }
let d=Math.floor(distance/(1000*60*60*24));
let h=Math.floor((distance%(1000*60*60*24))/(1000*60*60));
let m=Math.floor((distance%(1000*60*60))/(1000*60));
let s=Math.floor((distance%(1000*60))/1000);
countdown.innerHTML = d+"d "+h+"h "+m+"m "+s+"s";
}
setInterval(update,1000);
update();
}
</script>
</body>
</html>
