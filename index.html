<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<!-- OPTIMIZACIÓN iOS -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Para Michelina ❤️</title>

<style>

html,body{
margin:0;
padding:0;
height:100%;
overflow:hidden;
font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
background:black;
color:white;
text-align:center;
}

/* GALAXIA SUAVE PARA SAFARI */
body{
background: radial-gradient(circle at 50% 80%, #1a0033 0%, #000000 60%);
}

/* ESTRELLAS */
.stars{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(2px 2px at 20% 30%, white, transparent),
radial-gradient(1px 1px at 70% 80%, white, transparent),
radial-gradient(2px 2px at 40% 60%, white, transparent),
radial-gradient(1px 1px at 90% 10%, white, transparent);
background-size:300px 300px;
animation:moveStars 120s linear infinite;
z-index:0;
}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:-800px 800px;}
}

/* CONTENIDO */
.container{
position:relative;
z-index:5;
top:25vh;
padding:20px;
}

h1{
font-size:28px;
line-height:1.5;
text-shadow:0 0 20px #ff4da6;
}

/* BOTONES */
.buttons{
margin-top:40px;
display:flex;
flex-direction:column;
align-items:center;
gap:20px;
position:relative;
}

button{
padding:15px 40px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
transition:all 0.3s ease;
}

#yes{
background:#ff2e88;
color:white;
box-shadow:0 0 20px #ff2e88;
}

#no{
background:#222;
color:white;
}

/* MENSAJES */
.messageBox{
position:fixed;
background:#111;
padding:40px;
border-radius:25px;
border:3px solid #ff2e88;
font-size:22px;
max-width:280px;
box-shadow:0 0 30px #ff2e88;
animation:float 2s ease-in-out infinite alternate;
z-index:9999;
}

@keyframes float{
from{transform:translateY(0);}
to{transform:translateY(15px);}
}

.closeBtn{
position:absolute;
top:8px;
right:12px;
background:none;
border:none;
color:white;
font-size:20px;
cursor:pointer;
}

/* CORAZONES ESTRELLA FUGAZ */
.shootingHeart{
position:fixed;
font-size:18px;
animation:shoot 5s linear forwards;
z-index:2;
}

@keyframes shoot{
0%{transform:translate(0,0);opacity:1;}
100%{transform:translate(-600px,600px);opacity:0;}
}

/* SI GIGANTE */
.bigYes{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:60px;
background:#ff2e88;
padding:50px 80px;
border-radius:50px;
z-index:10000;
animation:heartbeat 1s infinite;
box-shadow:0 0 40px #ff2e88;
}

@keyframes heartbeat{
0%{transform:translate(-50%,-50%) scale(1);}
50%{transform:translate(-50%,-50%) scale(1.15);}
100%{transform:translate(-50%,-50%) scale(1);}
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="container">
<h1>
Michelina ❤️<br>
¿Quieres celebrar San Valentín<br>
con tu negro? ❤️
</h1>

<div class="buttons">
<button id="yes">Sí ❤️</button>
<button id="no">No ❌</button>
</div>
</div>

<script>

/* CORAZONES */
function createHeart(){
let heart=document.createElement("div");
heart.className="shootingHeart";
heart.innerHTML="💖";
heart.style.left=Math.random()*window.innerWidth+"px";
heart.style.top=Math.random()*window.innerHeight/2+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),5000);
}
setInterval(createHeart,1000);

/* FRASES */
let warnings=[
"¿Segura?",
"ja que tontaaaa 😜",
"imposibleeee",
"one two tree 🌳",
"hasta luego lucas",
"soy tu grano favorito",
"😗 silbando...",
"que no pesadaaa",
"vengaaaa casi",
"tu puedes 💪",
"última oportunidad",
"❌ Error 404"
];

let count=0;
let activeMessages=0;

const noBtn=document.getElementById("no");

noBtn.addEventListener("click",()=>{

if(count < warnings.length){

let box=document.createElement("div");
box.className="messageBox";
box.innerHTML=`<button class="closeBtn">X</button>${warnings[count]}`;

box.style.top=Math.random()*60+20+"%";
box.style.left=Math.random()*60+20+"%";

document.body.appendChild(box);
activeMessages++;

box.querySelector(".closeBtn").onclick=()=>{
box.remove();
activeMessages--;

if(warnings[count-1]==="❌ Error 404" && activeMessages===0){
showBigYes();
}
};

/* MOVER Y HACER PEQUEÑO */
noBtn.style.transform=`translate(${Math.random()*150-75}px, ${Math.random()*150-75}px) scale(${1 - count*0.06})`;

if(warnings[count]==="❌ Error 404"){
noBtn.style.display="none";   // 🔥 DESAPARECE EN EL ÚLTIMO
}

count++;

}

});

function showBigYes(){
document.body.innerHTML="<div class='stars'></div>";
let big=document.createElement("div");
big.className="bigYes";
big.innerText="SÍ ❤️";
document.body.appendChild(big);
}

</script>

</body>
</html>
