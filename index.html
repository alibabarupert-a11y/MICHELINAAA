<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Michelina ❤️</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:'Segoe UI', sans-serif;
color:white;
text-align:center;
background: radial-gradient(ellipse at bottom, #0d0d1a 0%, #000000 100%);
}

/* ESTRELLAS */
.stars{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(2px 2px at 20% 30%, white, transparent),
radial-gradient(1px 1px at 70% 80%, white, transparent),
radial-gradient(2px 2px at 40% 60%, white, transparent),
radial-gradient(1px 1px at 90% 10%, white, transparent);
background-repeat:repeat;
background-size:300px 300px;
animation:moveStars 80s linear infinite;
z-index:0;
}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:-1000px 1000px;}
}

.container{
position:relative;
z-index:5;
top:25vh;
padding:20px;
}

h1{
font-size:30px;
line-height:1.5;
text-shadow:0 0 20px #ff4da6;
}

/* BOTONES CENTRADOS */
.buttons{
margin-top:30px;
display:flex;
justify-content:center;
gap:40px;
position:relative;
}

#yes{
background:#ff2e88;
color:white;
box-shadow:0 0 20px #ff2e88;
padding:15px 40px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
}

#no{
background:#222;
color:white;
padding:15px 40px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
position:relative;
}

/* TEXTO TIPO MINECRAFT */
.minecraft{
position:absolute;
top:60px;
left:50%;
transform:translateX(-50%) rotate(-15deg);
color:yellow;
font-size:14px;
font-weight:bold;
text-shadow:0 0 10px yellow;
animation:pulse 1.5s infinite;
pointer-events:none;
}

@keyframes pulse{
0%{transform:translateX(-50%) rotate(-15deg) scale(1);}
50%{transform:translateX(-50%) rotate(-15deg) scale(1.15);}
100%{transform:translateX(-50%) rotate(-15deg) scale(1);}
}

/* MENSAJES */
.messageBox{
position:fixed;
background:#111;
padding:40px;
border-radius:25px;
border:3px solid #ff2e88;
z-index:9999;
font-size:22px;
max-width:300px;
box-shadow:0 0 30px #ff2e88;
animation:float 3s ease-in-out infinite alternate;
}

@keyframes float{
from{transform:translateY(0px);}
to{transform:translateY(20px);}
}

.closeBtn{
position:absolute;
top:10px;
right:15px;
background:none;
border:none;
color:white;
font-size:20px;
cursor:pointer;
}

/* CORAZONES */
.shootingHeart{
position:fixed;
font-size:20px;
z-index:2;
animation:shoot 4s linear forwards;
text-shadow:0 0 20px #ff4da6;
}

@keyframes shoot{
0%{transform:translate(0,0); opacity:1;}
100%{transform:translate(-800px,800px); opacity:0;}
}

.bigYes{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:65px;
background:#ff2e88;
padding:50px 90px;
border-radius:50px;
z-index:10000;
animation:heartbeat 1s infinite;
box-shadow:0 0 40px #ff2e88;
}

@keyframes heartbeat{
0%{transform:translate(-50%,-50%) scale(1);}
50%{transform:translate(-50%,-50%) scale(1.15);}
100%{transform:translate(-50%,-50%) scale(1);}
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="container">
<h1>
Michelina ❤️<br>
¿Quieres celebrar San Valentín<br>
con tu negro? ❤️
</h1>

<div class="buttons">
<button id="yes">Sí ❤️</button>
<button id="no">No ❌</button>
</div>

<div class="minecraft" id="splash">¿No lo ves o qué? →</div>

</div>

<script>

/* FRASES TIPO MINECRAFT */
let splashTexts=[
"¿No lo ves o qué? →",
"Está clarísimo →",
"Mira el botón rosa →",
"Yo que tú le daba →",
"El destino apunta ahí →",
"Sin miedo →",
"No seas tímida →",
"Es el correcto →"
];

let splash=document.getElementById("splash");
let splashIndex=0;

setInterval(()=>{
splashIndex=(splashIndex+1)%splashTexts.length;
splash.innerText=splashTexts[splashIndex];
},2000);

/* CORAZONES */
function createHeart(){
let heart=document.createElement("div");
heart.className="shootingHeart";
heart.innerHTML="💖";
heart.style.left=Math.random()*window.innerWidth+"px";
heart.style.top=Math.random()*window.innerHeight/2+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),4000);
}
setInterval(createHeart,800);

/* MENSAJES */
let warnings=[
"¿Segura?",
"ja ja que tontaaaa 😜",
"imposibleeee",
"hasta luego lucas 😏",
"soy tu grano favorito",
"que no pesadaaa 😂",
"vengaaaa casi",
"tu puedes 💪",
"última advertencia",
"❌ Error 404"
];

let count=0;
let activeMessages=0;

const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");

noBtn.addEventListener("click",()=>{

if(count < warnings.length){

let box=document.createElement("div");
box.className="messageBox";
box.innerHTML=`<button class="closeBtn">X</button>${warnings[count]}`;

box.style.top=Math.random()*70+"%";
box.style.left=Math.random()*70+"%";

document.body.appendChild(box);
activeMessages++;

box.querySelector(".closeBtn").onclick=()=>{
box.remove();
activeMessages--;

if(warnings[count-1] === "❌ Error 404" && activeMessages === 0){
noBtn.style.display="none";
showBigYes();
}
};

count++;
}

});

function showBigYes(){
let big=document.createElement("div");
big.className="bigYes";
big.innerText="SÍ ❤️";
document.body.appendChild(big);
}

</script>

</body>
</html>
