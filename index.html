<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Michelina ❤️</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:'Segoe UI', sans-serif;
color:white;
text-align:center;
background: radial-gradient(ellipse at bottom, #0d0d1a 0%, #000000 100%);
}

/* ESTRELLAS */
.stars{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(2px 2px at 20% 30%, white, transparent),
radial-gradient(1px 1px at 70% 80%, white, transparent),
radial-gradient(2px 2px at 40% 60%, white, transparent),
radial-gradient(1px 1px at 90% 10%, white, transparent);
background-repeat:repeat;
background-size:300px 300px;
animation:moveStars 80s linear infinite;
z-index:0;
}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:-1000px 1000px;}
}

.container{
position:relative;
z-index:5;
top:28vh;
padding:20px;
}

h1{
font-size:30px;
line-height:1.5;
text-shadow:0 0 20px #ff4da6;
}

.buttons{
margin-top:30px;
display:flex;
justify-content:center;
gap:30px;
}

button{
padding:15px 35px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
transition:0.3s;
}

#yes{
background:#ff2e88;
color:white;
box-shadow:0 0 20px #ff2e88;
}

#no{
background:#222;
color:white;
}

/* MENSAJES */
.messageBox{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:50px;
border-radius:25px;
border:3px solid #ff2e88;
z-index:9999;
font-size:24px;
width:85%;
max-width:420px;
box-shadow:0 0 40px #ff2e88;
}

.closeBtn{
margin-top:25px;
background:#ff2e88;
border:none;
padding:14px 25px;
border-radius:20px;
color:white;
font-size:16px;
}

/* SI GIGANTE */
.bigYes{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:65px;
background:#ff2e88;
padding:50px 90px;
border-radius:50px;
z-index:10000;
animation:heartbeat 1s infinite;
box-shadow:0 0 40px #ff2e88;
}

@keyframes heartbeat{
0%{transform:translate(-50%,-50%) scale(1);}
50%{transform:translate(-50%,-50%) scale(1.15);}
100%{transform:translate(-50%,-50%) scale(1);}
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="container">
<h1>
Michelina ❤️<br>
¿Quieres celebrar San Valentín<br>
con tu negro? ❤️
</h1>

<div class="buttons">
<button id="yes">Sí ❤️</button>
<button id="no">No ❌</button>
</div>
</div>

<script>

const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");

let warnings=[
"⚠️ ¿Estás completamente segura?",
"🚨 Riesgo extremo de abrazos infinitos",
"💘 Advertencia: nivel de amor subiendo",
"🔥 Esto puede provocar besos inesperados",
"💥 Tu corazón podría acelerarse",
"📍 Detectando sentimientos intensos...",
"😈 Última advertencia romántica",
"💫 No hay vuelta atrás...",
"⚡ El destino está observando...",
"❌ Error 404"
];

let closeTexts=[
"noooo",
"no",
"X",
"imposible",
"no puedes",
"cancelar",
"salir",
"borrar",
"cerrar",
"intentar huir"
];

let count=0;

noBtn.addEventListener("click",()=>{

if(count < warnings.length){

let box=document.createElement("div");
box.className="messageBox";
box.innerHTML=`${warnings[count]}
<br><button class="closeBtn">${closeTexts[count]}</button>`;

document.body.appendChild(box);

box.querySelector(".closeBtn").onclick=()=>{

box.remove();

if(warnings[count] === "❌ Error 404"){
showBigYes();
}

};

noBtn.style.transform="scale("+(1 - count*0.08)+")";

count++;

}

});

function showBigYes(){

document.body.innerHTML="";

let big=document.createElement("div");
big.className="bigYes";
big.innerText="SÍ ❤️";
document.body.appendChild(big);

big.addEventListener("click",()=>{
startCountdown();
});

}

yesBtn.addEventListener("click",startCountdown);

function startCountdown(){

document.body.innerHTML="<div class='stars'></div><div id='countdown' style='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:35px;text-shadow:0 0 20px #ff2e88;'></div>";

let countdown=document.getElementById("countdown");

let target=new Date();
target.setDate(target.getDate() + ((5 - target.getDay() + 7) % 7));
target.setHours(14,0,0);

function update(){

let now=new Date().getTime();
let distance=target - now;

if(distance<=0){
countdown.innerHTML="Espera impaciente ❤️";
return;
}

let d=Math.floor(distance/(1000*60*60*24));
let h=Math.floor((distance%(1000*60*60*24))/(1000*60*60));
let m=Math.floor((distance%(1000*60*60))/(1000*60));
let s=Math.floor((distance%(1000*60))/1000);

countdown.innerHTML=
d+"d "+h+"h "+m+"m "+s+"s ❤️";
}

setInterval(update,1000);
update();

}

</script>

</body>
</html>
