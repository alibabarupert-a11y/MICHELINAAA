<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Para Michelina ❤</title>
<style>
body{
margin:0;
overflow:hidden;
font-family:'Segoe UI', sans-serif;
color:white;
text-align:center;
background: radial-gradient(ellipse at bottom, #0d0d1a 0%, #000000 100%);
touch-action: manipulation;
}
/* ESTRELLAS */
.stars{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(2px 2px at 20% 30%, white, transparent),
radial-gradient(1px 1px at 70% 80%, white, transparent),
radial-gradient(2px 2px at 40% 60%, white, transparent),
radial-gradient(1px 1px at 90% 10%, white, transparent);
background-repeat:repeat;
background-size:300px 300px;
animation:moveStars 80s linear infinite;
z-index:0;
}
@keyframes moveStars{
from{background-position:0 0;}
to{background-position:-1000px 1000px;}
}
.container{
position:relative;
z-index:5;
top:15vh; /* Ajustado para mejor visibilidad móvil */
padding:20px;
}
h1{
font-size:26px; /* Tamaño optimizado para móvil */
line-height:1.3;
text-shadow:0 0 20px #ff4da6;
padding: 0 10px;
}
.buttons{
margin-top:50px;
position:relative;
display: inline-block;
}
/* EFECTO MINECRAFT SPLASH */
#minecraftSplash {
 position: absolute;
 top: -40px;
 right: -20px;
 color: #ffff00;
 font-weight: bold;
 font-size: 18px;
 text-shadow: 2px 2px #3f3f00;
 transform: rotate(-20deg);
 z-index: 100;
 pointer-events: none;
 animation: mc-pulse 0.5s infinite alternate;
 font-family: 'Courier New', Courier, monospace; /* Fuente estilo juego */
}
@keyframes mc-pulse {
 from { transform: rotate(-20deg) scale(1); }
 to { transform: rotate(-20deg) scale(1.1); }
}
#yes{
position:relative;
background:#ff2e88;
color:white;
box-shadow:0 0 20px #ff2e88;
padding:15px 35px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
}
#no{
position:absolute;
left:50%;
top:80px;
transform: translateX(-50%);
background:#222;
color:white;
padding:15px 35px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
}
/* MENSAJES */
.messageBox{
position:fixed;
background:#111;
padding:30px;
border-radius:25px;
border:3px solid #ff2e88;
z-index:9999;
font-size:20px;
max-width:250px;
box-shadow:0 0 30px #ff2e88;
}
.closeBtn{
position:absolute;
top:10px;
right:15px;
background:none;
border:none;
color:white;
font-size:20px;
cursor:pointer;
}
/* CORAZONES */
.shootingHeart{
position:fixed;
font-size:20px;
z-index:2;
animation:shoot 4s linear forwards;
text-shadow:0 0 20px #ff4da6;
}
@keyframes shoot{
0%{transform:translate(0,0); opacity:1;}
100%{transform:translate(-800px,800px); opacity:0;}
}
</style>
</head>
<body>
<div class="stars"></div>
<div class="container">
<h1>Michelina <br> ❤ <br> ¿Quieres celebrar San Valentín con tu negro? ❤ </h1>
<div class="buttons">
<button id="yes">Sí </button> ❤
<div id="minecraftSplash">¿No lo ves o qué?</div>
<button id="no">No </button> ❌
</div>
</div>

<script>
/* CORAZONES */
function createHeart(){
let heart=document.createElement("div");
heart.className="shootingHeart";
heart.innerHTML="💖"; 
heart.style.left=Math.random()*window.innerWidth+"px";
heart.style.top=Math.random()*window.innerHeight/2+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),4000);
}
setInterval(createHeart,800);

/* FRASES Y LÓGICA */
let warnings=[" ¿Segura?", "ja ja que tontaaaa ", "imposibleeee", "one two tree ", "hasta luego lucas ", "soy tu grano favorito", " silbando...", ".........", "que no pesadaaa ", "vengaaaa casi", "tu puedes ", "amor detectado ", "no puedes escapar ", "última advertencia romántica", " Error 404"];
let count=0;
let activeMessages=0;
const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");

noBtn.addEventListener("click",()=>{
if(count < warnings.length){
let box=document.createElement("div");
box.className="messageBox";
box.innerHTML=`<button class="closeBtn">X</button>${warnings[count]}`;
box.style.top=Math.random()*60+"%";
box.style.left=Math.random()*60+"%";
document.body.appendChild(box);
activeMessages++;
box.querySelector(".closeBtn").onclick=()=>{
box.remove();
activeMessages--;
if(warnings[count-1] === " Error 404" && activeMessages === 0){
showBigYes();
}
};
noBtn.style.top=Math.random()*70+"%";
noBtn.style.left=Math.random()*70+"%";
noBtn.style.transform="scale("+(1 - count*0.05)+")";
count++;
}
});

function showBigYes(){
/* Aquí iría la lógica del SI gigante del PDF original */
}

yesBtn.addEventListener("click", () => {
    alert("¡Sabía que dirías que sí!");
});
</script>
</body>
</html>
