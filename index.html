<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Michelina ❤️</title>

<style>

body{
margin:0;
overflow:hidden;
font-family: 'Segoe UI', sans-serif;
color:white;
text-align:center;
background: radial-gradient(ellipse at bottom, #090a1a 0%, #000000 100%);
}

/* ESTRELLAS */
.stars{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(2px 2px at 20% 30%, white, transparent),
radial-gradient(1px 1px at 70% 80%, white, transparent),
radial-gradient(2px 2px at 40% 60%, white, transparent),
radial-gradient(1px 1px at 90% 10%, white, transparent);
background-repeat:repeat;
background-size:300px 300px;
animation:moveStars 60s linear infinite;
z-index:0;
}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:-1000px 1000px;}
}

/* CONTENIDO */
.container{
position:relative;
z-index:5;
top:30vh;
padding:20px;
}

h1{
font-size:28px;
line-height:1.4;
text-shadow:0 0 15px rgba(255,100,200,0.7);
}

button{
padding:15px 30px;
font-size:18px;
margin:15px;
border:none;
border-radius:30px;
cursor:pointer;
transition:0.3s;
}

#yes{
background:#ff2e88;
color:white;
box-shadow:0 0 15px #ff2e88;
}

#no{
background:#222;
color:white;
position:absolute;
}

/* MENSAJES GRANDES */
.messageBox{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#0d0d0d;
padding:40px;
border-radius:25px;
border:3px solid #ff2e88;
z-index:9999;
font-size:22px;
width:80%;
max-width:400px;
box-shadow:0 0 30px #ff2e88;
}

.closeBtn{
margin-top:20px;
background:#ff2e88;
border:none;
padding:12px 20px;
border-radius:15px;
color:white;
font-size:16px;
}

/* CORAZONES FUGACES */
.shootingHeart{
position:fixed;
font-size:22px;
color:#ff4da6;
text-shadow:0 0 15px #ff4da6;
z-index:2;
animation:shoot 4s linear forwards;
}

@keyframes shoot{
0%{transform:translate(0,0) scale(1); opacity:1;}
100%{transform:translate(-600px,600px) scale(0.5); opacity:0;}
}

/* CONTADOR */
#countdown{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:35px;
z-index:10000;
text-shadow:0 0 20px #ff2e88;
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="container" id="main">
<h1>
Michelina ❤️<br>
¿Quieres celebrar San Valentín conmigo,<br>
con tu negro? ❤️
</h1>

<button id="yes">Sí ❤️</button>
<button id="no">No ❌</button>
</div>

<audio id="noSound">
<source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_7d1e7b4f02.mp3">
</audio>

<script>

/* CORAZONES FUGACES */
function createHeart(){
let heart=document.createElement("div");
heart.className="shootingHeart";
heart.innerHTML="💖";
heart.style.left=Math.random()*window.innerWidth+"px";
heart.style.top=Math.random()*window.innerHeight/2+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),4000);
}
setInterval(createHeart,800);

/* MENSAJES NO */
const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const noSound=document.getElementById("noSound");

let warnings=[
"⚠️ ¿Segura que quieres pulsar eso?",
"🚨 Esto puede provocar besos inesperados",
"💥 Riesgo extremo de abrazos infinitos",
"💘 Advertencia: amor en aumento",
"📍 Se detecta corazón acelerado",
"❌ Error 404: opción no válida",
"🔥 Última oportunidad antes de que el destino actúe..."
];

let count=0;

noBtn.addEventListener("click",()=>{

noSound.play();

let box=document.createElement("div");
box.className="messageBox";
box.innerHTML=`${warnings[count % warnings.length]}
<br><button class="closeBtn">Cerrar si te atreves</button>`;
document.body.appendChild(box);

box.querySelector(".closeBtn").onclick=()=>box.remove();

noBtn.style.top=Math.random()*80+"%";
noBtn.style.left=Math.random()*80+"%";

count++;

});

/* SI */
yesBtn.addEventListener("click",startCountdown);

function startCountdown(){

document.body.innerHTML="<div class='stars'></div><div id='countdown'></div>";
let countdown=document.getElementById("countdown");

let target=new Date();
target.setDate(target.getDate() + ((5 - target.getDay() + 7) % 7));
target.setHours(14,0,0);

function update(){

let now=new Date().getTime();
let distance=target - now;

if(distance<=0){
countdown.innerHTML="Espera impaciente ❤️";
return;
}

let d=Math.floor(distance/(1000*60*60*24));
let h=Math.floor((distance%(1000*60*60*24))/(1000*60*60));
let m=Math.floor((distance%(1000*60*60))/(1000*60));
let s=Math.floor((distance%(1000*60))/1000);

countdown.innerHTML=
d+"d "+h+"h "+m+"m "+s+"s ❤️";
}

setInterval(update,1000);
update();

}

</script>

</body>
</html>
