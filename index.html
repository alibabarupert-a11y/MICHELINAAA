<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>San Valentín</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial, sans-serif;
background:radial-gradient(circle at center, #1b0033 0%, #000000 80%);
color:white;
text-align:center;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

h1{
font-size:28px;
margin:0 20px;
}

.buttons{
margin-top:30px;
display:flex;
flex-direction:column;
align-items:center;
gap:20px;
}

button{
padding:15px 40px;
font-size:20px;
border:none;
border-radius:30px;
cursor:pointer;
transition:0.3s;
}

#si{
background:#ff2e63;
color:white;
}

#no{
background:#222;
color:white;
position:relative;
}

.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
color:black;
padding:30px;
border-radius:15px;
font-size:22px;
z-index:9999;
animation:pop 0.3s ease;
}

.popup button{
position:absolute;
top:5px;
right:10px;
background:none;
font-size:20px;
cursor:pointer;
}

@keyframes pop{
from{transform:translate(-50%,-50%) scale(0);}
to{transform:translate(-50%,-50%) scale(1);}
}
</style>
</head>

<body>

<h1>Michelina ❤️<br>¿Quieres celebrar San Valentín con tu negro?</h1>

<div class="buttons">
<button id="si">SÍ</button>
<button id="no">NO</button>
</div>

<script>
const noBtn = document.getElementById("no");
const siBtn = document.getElementById("si");

let mensajes = [
"ja que tontaaaa",
"imposible",
"one two tree",
"hasta luego lucas",
"soy tu grano favorito 😏",
"😗",
".........",
"que no pesadaaa",
"vengaaaa casi",
"tu puedes",
"NOOOO",
"Error 404"
];

let contador = 0;

noBtn.addEventListener("click", () => {

if(contador < mensajes.length){

let popup = document.createElement("div");
popup.className="popup";
popup.innerHTML = mensajes[contador] + '<button>X</button>';

document.body.appendChild(popup);

popup.querySelector("button").onclick = ()=>{
popup.remove();
if(mensajes[contador] === "Error 404"){
mostrarSiGigante();
}
};

contador++;

let x = Math.random() * (window.innerWidth - 150);
let y = Math.random() * (window.innerHeight - 80);
noBtn.style.position="absolute";
noBtn.style.left = x + "px";
noBtn.style.top = y + "px";

let size = 20 - contador;
if(size > 8){
noBtn.style.fontSize = size + "px";
}

navigator.vibrate?.(100);

}
});

function mostrarSiGigante(){
siBtn.style.position="fixed";
siBtn.style.top="50%";
siBtn.style.left="50%";
siBtn.style.transform="translate(-50%,-50%) scale(3)";
siBtn.style.zIndex="99999";
}

siBtn.addEventListener("click",()=>{
alert("Sabía que ibas a decir que sí 😏❤️");
});
</script>

</body>
</html>
