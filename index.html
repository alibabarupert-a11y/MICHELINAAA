<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Michelina ❤️</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:'Segoe UI', sans-serif;
color:white;
text-align:center;
background: radial-gradient(ellipse at bottom, #0d0d1a 0%, #000000 100%);
}

/* FONDO GALAXIA */
.stars{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(2px 2px at 20% 30%, white, transparent),
radial-gradient(1px 1px at 70% 80%, white, transparent),
radial-gradient(2px 2px at 40% 60%, white, transparent),
radial-gradient(1px 1px at 90% 10%, white, transparent);
background-repeat:repeat;
background-size:300px 300px;
animation:moveStars 80s linear infinite;
z-index:0;
}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:-1000px 1000px;}
}

/* CONTENIDO */
.container{
position:relative;
z-index:5;
top:25vh;
}

h1{
font-size:30px;
line-height:1.5;
text-shadow:0 0 20px #ff4da6;
}

.buttons{
margin-top:30px;
display:flex;
justify-content:center;
gap:40px;
position:relative;
}

button{
padding:15px 40px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
transition:all 0.3s ease;
}

#yes{
background:#ff2e88;
color:white;
box-shadow:0 0 20px #ff2e88;
}

#no{
background:#222;
color:white;
position:relative;
}

/* MENSAJES */
.messageBox{
position:fixed;
background:#111;
padding:30px;
border-radius:25px;
border:3px solid #ff2e88;
z-index:9999;
box-shadow:0 0 30px #ff2e88;
}

.closeBtn{
position:absolute;
top:8px;
right:12px;
background:none;
border:none;
color:white;
font-size:18px;
cursor:pointer;
}

/* SÍ GIGANTE FINAL */
.bigYes{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:70px;
background:#ff2e88;
padding:60px 100px;
border-radius:50px;
z-index:10000;
animation:heartbeat 1s infinite;
box-shadow:0 0 50px #ff2e88;
}

@keyframes heartbeat{
0%{transform:translate(-50%,-50%) scale(1);}
50%{transform:translate(-50%,-50%) scale(1.15);}
100%{transform:translate(-50%,-50%) scale(1);}
}

.finalScreen{
position:fixed;
width:100%;
height:100%;
background: radial-gradient(circle, #2b0033, #000);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:11000;
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="container">
<h1>
Michelina ❤️<br>
¿Quieres celebrar San Valentín<br>
con tu negro? ❤️
</h1>

<div class="buttons">
<button id="yes">Sí ❤️</button>
<button id="no">No ❌</button>
</div>
</div>

<script>

let warnings=[
"¿Segura?",
"ja ja que tontaaaa 😜",
"imposibleeee",
"one two tree 🌳",
"hasta luego lucas 😏",
"soy tu grano favorito",
"que no pesadaaa 😂",
"vengaaaa casi",
"tu puedes 💪",
"noooo",
"imposible",
"ni de broma",
"error en tu decisión",
"esto no va así",
"última oportunidad",
"piénsalo bien",
"segurísima?",
"❌ Error 404"
];

let count=0;
let activeMessages=0;
let errorBox=null;

const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");

/* BOTON NO */
noBtn.addEventListener("click",()=>{

if(count < warnings.length){

let box=document.createElement("div");
box.className="messageBox";

let size=Math.random()*20+18;
box.style.fontSize=size+"px";

box.style.top=Math.random()*70+"%";
box.style.left=Math.random()*70+"%";

box.innerHTML=`<button class="closeBtn">X</button>${warnings[count]}`;

document.body.appendChild(box);

if(warnings[count] === "❌ Error 404"){
errorBox=box;
}

activeMessages++;

box.querySelector(".closeBtn").onclick=()=>{

if(box === errorBox){
if(activeMessages === 1){
box.remove();
showBigYes();
}
}else{
box.remove();
activeMessages--;
}
};

count++;

/* mover y reducir NO */
let currentSize=parseFloat(window.getComputedStyle(noBtn).fontSize);
if(currentSize > 10){
noBtn.style.fontSize=(currentSize-2)+"px";
noBtn.style.transform=`translate(${Math.random()*200-100}px, ${Math.random()*200-100}px)`;
}else{
noBtn.style.opacity="0";
}

}

});

/* SÍ GIGANTE */
function showBigYes(){
let big=document.createElement("div");
big.className="bigYes";
big.innerText="SÍ ❤️";
document.body.appendChild(big);

big.onclick=()=>{
showFinal();
};
}

/* PANTALLA FINAL */
function showFinal(){

document.body.innerHTML="";

let final=document.createElement("div");
final.className="finalScreen";

let text=document.createElement("h1");
text.innerHTML="Sabía que dirías que sí ❤️<br><br>";

let timer=document.createElement("div");
timer.style.fontSize="25px";

final.appendChild(text);
final.appendChild(timer);
document.body.appendChild(final);

/* TEMPORIZADOR hasta viernes 14:00 */
function updateTimer(){
let now=new Date();
let target=new Date();
target.setHours(14,0,0,0);

while(target < now){
target.setDate(target.getDate()+1);
}

let diff=target-now;

let h=Math.floor(diff/1000/60/60);
let m=Math.floor(diff/1000/60)%60;
let s=Math.floor(diff/1000)%60;

timer.innerHTML="Cuenta atrás: "+h+"h "+m+"m "+s+"s ❤️";

if(diff<=0){
timer.innerHTML="Espera impaciente ❤️";
}
}

setInterval(updateTimer,1000);

}

</script>

</body>
</html>
