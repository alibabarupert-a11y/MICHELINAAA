<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Michelina ❤️</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial, sans-serif;
color:white;
text-align:center;
background: radial-gradient(circle at 30% 30%, #2b1055, #000814 60%, black);
}

/* Nebulosa efecto */
body::before{
content:"";
position:fixed;
width:200%;
height:200%;
background:
radial-gradient(circle at 70% 40%, rgba(255,0,150,0.2), transparent 40%),
radial-gradient(circle at 20% 70%, rgba(0,150,255,0.2), transparent 40%);
animation:moveNebula 20s linear infinite;
z-index:0;
}

@keyframes moveNebula{
from{transform:translate(-10%,-10%);}
to{transform:translate(10%,10%);}
}

.container{
position:relative;
z-index:2;
top:30vh;
}

button{
padding:15px 30px;
font-size:18px;
margin:10px;
border:none;
border-radius:30px;
cursor:pointer;
transition:0.3s;
}

#yes{
background:#ff4d88;
color:white;
}

#no{
background:#333;
color:white;
position:absolute;
}

.messageBox{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:20px;
border-radius:20px;
border:2px solid #ff4d88;
z-index:9999;
}

.closeBtn{
margin-top:10px;
cursor:pointer;
background:#ff4d88;
border:none;
padding:8px 15px;
border-radius:10px;
color:white;
}

.bigYes{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:60px;
background:#ff1a75;
padding:40px 80px;
border-radius:50px;
z-index:10000;
animation:heartbeat 1s infinite;
}

@keyframes heartbeat{
0%{transform:translate(-50%,-50%) scale(1);}
50%{transform:translate(-50%,-50%) scale(1.1);}
100%{transform:translate(-50%,-50%) scale(1);}
}

#countdown{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:35px;
z-index:10000;
}

.heart{
position:fixed;
font-size:20px;
animation:shoot 4s linear infinite;
z-index:1;
}

@keyframes shoot{
0%{transform:translateY(100vh) translateX(0); opacity:1;}
100%{transform:translateY(-10vh) translateX(50px); opacity:0;}
}

</style>
</head>

<body>

<div class="container" id="main">
<h1>Michelina ❤️<br>¿Quieres celebrar San Valentín conmigo,<br>con tu negro? ❤️</h1>
<button id="yes">Sí ❤️</button>
<button id="no">No ❌</button>
</div>

<audio id="noSound">
<source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_7d1e7b4f02.mp3" type="audio/mpeg">
</audio>

<script>

/* Corazones fugaces */
function createFallingHearts(){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="💖";
heart.style.left=Math.random()*100+"%";
heart.style.animationDuration=(Math.random()*3+2)+"s";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),4000);
}
setInterval(createFallingHearts,600);

/* Botones */
const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const noSound=document.getElementById("noSound");

let warnings=[
"⚠️ ¿Segura?",
"💥 Puede pasar algo peligroso...",
"🚨 Riesgo alto de enamorarte más",
"❌ Error 404",
];

let count=0;

noBtn.addEventListener("click",()=>{

noSound.play();

if(count<warnings.length){

let box=document.createElement("div");
box.className="messageBox";
box.innerHTML=`<p>${warnings[count]}</p>
<button class="closeBtn">X</button>`;
document.body.appendChild(box);

box.querySelector(".closeBtn").onclick=()=>box.remove();

noBtn.style.top=Math.random()*80+"%";
noBtn.style.left=Math.random()*80+"%";

count++;

}else{

document.body.innerHTML="";
let big=document.createElement("div");
big.className="bigYes";
big.innerText="SÍ ❤️";
document.body.appendChild(big);

big.addEventListener("click",startCountdown);

}
});

yesBtn.addEventListener("click",startCountdown);

/* TEMPORIZADOR */
function startCountdown(){

document.body.innerHTML="<div id='countdown'></div>";
let countdown=document.getElementById("countdown");

let target=new Date();
target.setDate(target.getDate() + ((5 - target.getDay() + 7) % 7));
target.setHours(14,0,0);

function update(){

let now=new Date().getTime();
let distance=target - now;

if(distance<=0){
countdown.innerHTML="Espera impaciente ❤️";
return;
}

let days=Math.floor(distance/(1000*60*60*24));
let hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));
let minutes=Math.floor((distance%(1000*60*60))/(1000*60));
let seconds=Math.floor((distance%(1000*60))/1000);

countdown.innerHTML=
days+"d "+hours+"h "+minutes+"m "+seconds+"s ❤️";
}

setInterval(update,1000);
update();

}

</script>

</body>
</html>
