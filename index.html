<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Michelina ❤️</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:'Segoe UI', sans-serif;
color:white;
text-align:center;
background: radial-gradient(ellipse at bottom, #0d0d1a 0%, #000000 100%);
}

/* ESTRELLAS */
.stars{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(2px 2px at 20% 30%, white, transparent),
radial-gradient(1px 1px at 70% 80%, white, transparent),
radial-gradient(2px 2px at 40% 60%, white, transparent),
radial-gradient(1px 1px at 90% 10%, white, transparent);
background-repeat:repeat;
background-size:300px 300px;
animation:moveStars 80s linear infinite;
z-index:0;
}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:-1000px 1000px;}
}

/* CONTENIDO */
.container{
position:relative;
z-index:5;
top:28vh;
padding:20px;
}

h1{
font-size:30px;
line-height:1.5;
text-shadow:0 0 20px #ff4da6;
}

.buttons{
margin-top:30px;
display:flex;
justify-content:center;
gap:30px;
}

button{
padding:15px 35px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
transition:0.3s;
}

#yes{
background:#ff2e88;
color:white;
box-shadow:0 0 20px #ff2e88;
}

#no{
background:#222;
color:white;
}

/* MENSAJES */
.messageBox{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:50px;
border-radius:25px;
border:3px solid #ff2e88;
z-index:9999;
font-size:24px;
width:85%;
max-width:420px;
box-shadow:0 0 40px #ff2e88;
position:fixed;
}

.closeBtn{
position:absolute;
top:15px;
right:20px;
background:none;
border:none;
color:white;
font-size:22px;
cursor:pointer;
}

/* CORAZONES FUGACES */
.shootingHeart{
position:fixed;
font-size:20px;
z-index:2;
animation:shoot 4s linear forwards;
text-shadow:0 0 20px #ff4da6;
}

@keyframes shoot{
0%{transform:translate(0,0) scale(1); opacity:1;}
100%{transform:translate(-800px,800px) scale(0.5); opacity:0;}
}

/* SI GIGANTE */
.bigYes{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:65px;
background:#ff2e88;
padding:50px 90px;
border-radius:50px;
z-index:10000;
animation:heartbeat 1s infinite;
box-shadow:0 0 40px #ff2e88;
}

@keyframes heartbeat{
0%{transform:translate(-50%,-50%) scale(1);}
50%{transform:translate(-50%,-50%) scale(1.15);}
100%{transform:translate(-50%,-50%) scale(1);}
}

#countdown{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:35px;
text-shadow:0 0 20px #ff2e88;
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="container">
<h1>
Michelina ❤️<br>
¿Quieres celebrar San Valentín<br>
con tu negro? ❤️
</h1>

<div class="buttons">
<button id="yes">Sí ❤️</button>
<button id="no">No ❌</button>
</div>
</div>

<script>

/* CORAZONES FUGACES */
function createHeart(){
let heart=document.createElement("div");
heart.className="shootingHeart";
heart.innerHTML="💖";
heart.style.left=Math.random()*window.innerWidth+"px";
heart.style.top=Math.random()*window.innerHeight/2+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),4000);
}
setInterval(createHeart,900);

/* MENSAJES NO */
const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");

let warnings=[
"⚠️ ¿Segura?",
"🚨 Peligro de abrazos infinitos",
"💘 Amor detectado",
"🔥 Besos inesperados en camino",
"💫 El destino insiste...",
"😈 No puedes escapar",
"❌ Error 404"
];

let count=0;

noBtn.addEventListener("click",()=>{

if(count < warnings.length){

let box=document.createElement("div");
box.className="messageBox";
box.innerHTML=`<button class="closeBtn">X</button>${warnings[count]}`;
document.body.appendChild(box);

box.querySelector(".closeBtn").onclick=()=>{
box.remove();
if(warnings[count] === "❌ Error 404"){
showBigYes();
}
};

noBtn.style.transform="scale("+(1 - count*0.08)+")";

count++;
}

});

/* SI GIGANTE */
function showBigYes(){

document.body.innerHTML="<div class='stars'></div>";

let big=document.createElement("div");
big.className="bigYes";
big.innerText="SÍ ❤️";
document.body.appendChild(big);

big.addEventListener("click",()=>{
showLoveMessage();
});

}

/* MENSAJE SABÍA QUE SÍ */
function showLoveMessage(){

document.body.innerHTML="<div class='stars'></div><div id='countdown'>Sabía que ibas a decir que sí ❤️</div>";

setTimeout(()=>{
startCountdown();
},3000);

}

/* TEMPORIZADOR */
yesBtn.addEventListener("click",showLoveMessage);

function startCountdown(){

document.body.innerHTML="<div class='stars'></div><div id='countdown'></div>";
let countdown=document.getElementById("countdown");

let target=new Date();
target.setDate(target.getDate() + ((5 - target.getDay() + 7) % 7));
target.setHours(14,0,0);

function update(){

let now=new Date().getTime();
let distance=target - now;

if(distance<=0){
countdown.innerHTML="Espera impaciente ❤️";
return;
}

let d=Math.floor(distance/(1000*60*60*24));
let h=Math.floor((distance%(1000*60*60*24))/(1000*60*60));
let m=Math.floor((distance%(1000*60*60))/(1000*60));
let s=Math.floor((distance%(1000*60))/1000);

countdown.innerHTML=
d+"d "+h+"h "+m+"m "+s+"s ❤️";
}

setInterval(update,1000);
update();

}

</script>

</body>
</html>
