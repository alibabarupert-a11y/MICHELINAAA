<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Un Mensaje Especial</title>
<!-- Librería para convertir el ticket en imagen descargable -->
<script src="https://cdnjs.cloudflare.com"></script>

<style>
body{ margin:0; overflow:hidden; font-family:'Segoe UI', sans-serif; color:white; text-align:center; background: radial-gradient(ellipse at bottom, #0d0d1a 0%, #000000 100%); touch-action: manipulation; }

/* ESTRELLAS FUGACES */
.shooting-heart { position: fixed; top: -50px; color: #ff4da6; font-size: 20px; z-index: 1; animation: shootLinear 3s linear forwards; filter: drop-shadow(0 0 10px #ff4da6); }
.shooting-heart::after { content: ''; position: absolute; top: 50%; right: 100%; width: 80px; height: 2px; background: linear-gradient(to right, transparent, #ff4da6); transform: translateY(-50%); }
@keyframes shootLinear { 0% { transform: translate(0, 0) rotate(45deg); opacity: 1; } 100% { transform: translate(-100vw, 100vh) rotate(45deg); opacity: 0; } }

.stars{ position:fixed; width:100%; height:100%; background: radial-gradient(2px 2px at 20% 30%, white, transparent), radial-gradient(1px 1px at 70% 80%, white, transparent); background-size:300px 300px; animation:moveStars 80s linear infinite; z-index:0; }
@keyframes moveStars{ from{background-position:0 0;} to{background-position:-1000px 1000px;} }

.container{ position:relative; z-index:5; top:15vh; padding:10px; }
h1{ font-size:24px; text-shadow:0 0 20px #ff4da6; }
.buttons{ margin-top:20px; position:relative; display: inline-block; }

#yes, #no{ padding:12px 30px; font-size:18px; border:none; border-radius:30px; cursor:pointer; }
#yes{ background:#ff2e88; color:white; box-shadow:0 0 20px #ff2e88; }
#no{ position:absolute; left:50%; top:70px; transform: translateX(-50%); background:#222; color:white; }

/* DISEÑO TICKET VIP */
#ticketWrapper {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20000;
}
.ticket-card {
    width: 300px; background: #fff; color: #333; border-radius: 15px; overflow: hidden; box-shadow: 0 0 40px rgba(255, 46, 136, 0.6); font-family: 'Courier New', Courier, monospace; border: 2px solid #ff2e88;
}
.ticket-header { background: #ff2e88; color: white; padding: 15px; font-weight: bold; font-size: 22px; letter-spacing: 2px; }
.ticket-body { padding: 20px; border-bottom: 2px dashed #ff2e88; position: relative; background: #fffafc; }
.ticket-body p { margin: 8px 0; font-size: 14px; text-align: left; border-left: 3px solid #ff2e88; padding-left: 10px; }
.barcode { font-size: 10px; letter-spacing: 5px; margin-top: 15px; font-weight: bold; }
.btn-download { margin-top: 15px; background: #ff2e88; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; width: 100%; }

#btnTicketOpen { display: none; position: fixed; bottom: 8vh; left: 50%; transform: translateX(-50%); background: gold; color: black; padding: 15px 25px; border-radius: 50px; font-weight: bold; z-index: 100; box-shadow: 0 0 20px gold; cursor:pointer; }
#countdown{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); font-size:35px; width: 90%; text-shadow:0 0 20px #ff4da6; font-weight: bold; }
.photo-confetti { position: fixed; width: 50px; height: 50px; border-radius: 50%; border: 2px solid white; object-fit: cover; z-index: 9999; animation: fall 4s linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }
</style>
</head>

<body>
<div class="stars"></div>
<div class="container" id="mainContainer">
    <h1>Un Mensaje Especial ❤️<br>¿Quieres celebrar un día importante<br>conmigo? ❤️</h1>
    <div class="buttons">
        <button id="yes">Sí ❤️</button>
        <button id="no">No ❌</button>
    </div>
</div>

<!-- CONTENEDOR DEL TICKET -->
<div id="ticketWrapper">
    <div class="ticket-card" id="ticketToImage">
        <div class="ticket-header">ENTRADA VIP ❤️</div>
        <div class="ticket-body">
            <p><strong>PARA:</strong> [Nombre]</p>
            <p><strong>VÁLIDO POR:</strong> 1 Momento Especial</p>
            <p><strong>LUGAR:</strong> Mi lugar favorito</p>
            <p><strong>FECHA:</strong> [Fecha]</p>
            <div class="barcode">|||| [Código] ||||</div>
        </div>
    </div>
    <button class="btn-download" onclick="downloadTicket()">⬇️ GUARDAR EN GALERÍA</button>
</div>

<button id="btnTicketOpen" onclick="document.getElementById('ticketWrapper').style.display='block'">✨ VER MI ENTRADA VIP ✨</button>

<audio id="errorSound" src="https://www.myinstants.com"></audio>
<audio id="successSound" src="https://www.myinstants.com"></audio>

<script>
// --- PON AQUÍ TUS ENLACES DE FOTOS ---
const misFotos = [];

function createShootingHeart() {
    const h = document.createElement("div");
    h.className = "shooting-heart"; h.innerText = "❤️";
    h.style.left = Math.random() * 150 + 50 + "vw";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 3000);
}
setInterval(createShootingHeart, 3000);

const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const errorSound = document.getElementById("errorSound");
const successSound = document.getElementById("successSound");

noBtn.addEventListener("click",()=>{
    errorSound.currentTime = 0; errorSound.play().catch(()=>{});
    noBtn.style.position = "fixed";
    noBtn.style.left = Math.random() * (window.innerWidth - 100) + "px";
    noBtn.style.top = Math.random() * (window.innerHeight - 60) + "px";
});

yesBtn.onclick = () => {
    successSound.play().catch(()=>{});
    document.body.innerHTML = `
        <div class='stars'></div>
        <div style='position:fixed; top:5vh; width:100%; color:red; font-size:28px; font-weight:bold; z-index:10;'>❤️ FELIZ DÍA ESPECIAL ❤️</div>
        <div id='countdown'>Cargando...</div>
        <button id="btnTicketOpen" onclick="document.getElementById('ticketWrapper').style.display='block'">✨ VER MI ENTRADA VIP ✨</button>
    `;
    startCountdown();
};

function startCountdown(){
    const countdownContainer = document.getElementById('countdown');
    const btnTicket = document.getElementById('btnTicketOpen');
    
    function update(){
        let target = new Date();
        target.setDate(target.getDate() + ((5 - target.getDay() + 7) % 7));
        target.setHours(14,0,0,0);
        let dist = target - new Date();
        
        if(dist <= 0) {
            countdownContainer.innerHTML = "¡El momento es ahora! ❤️";
            btnTicket.style.display = "block";
            return;
        }
        let d=Math.floor(dist/(1000*60*60*24)), h=Math.floor((dist%(1000*60*60*24))/(1000*60*60)), m=Math.floor((dist%(1000*60*60))/(1000*60)), s=Math.floor((dist%(1000*60))/1000);
        countdownContainer.innerHTML = `${d}d ${h}h ${m}m ${s}s`;
    }
    setInterval(update, 1000); update();
}

// FUNCIÓN PARA DESCARGAR EL TICKET COMO IMAGEN
function downloadTicket() {
    const ticket = document.getElementById('ticketToImage');
    html2canvas(ticket).then(canvas => {
        const link = document.createElement('a');
        link.download = 'entrada-vip.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}
</script>
</body>
</html>
