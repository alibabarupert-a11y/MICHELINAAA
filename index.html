<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Michelina ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
font-family:'Segoe UI', sans-serif;
color:white;
text-align:center;
background: radial-gradient(ellipse at bottom, #0d0d1a 0%, #000000 100%);
}

/* ESTRELLAS */
.stars{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(2px 2px at 20% 30%, white, transparent),
radial-gradient(1px 1px at 70% 80%, white, transparent),
radial-gradient(2px 2px at 40% 60%, white, transparent),
radial-gradient(1px 1px at 90% 10%, white, transparent);
background-repeat:repeat;
background-size:300px 300px;
animation:moveStars 80s linear infinite;
z-index:0;
}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:-1000px 1000px;}
}

.container{
position:relative;
z-index:5;
top:28vh;
padding:20px;
}

h1{
font-size:32px;
line-height:1.6;
text-shadow:0 0 25px #ff4da6;
animation: glow 3s ease-in-out infinite alternate;
}

@keyframes glow{
from{ text-shadow:0 0 10px #ff4da6; }
to{ text-shadow:0 0 30px #ff99cc; }
}

.buttons{
margin-top:30px;
position:relative;
height:100px;
}

button{
transition: all 0.3s ease;
}

#yes{
background:#ff2e88;
color:white;
box-shadow:0 0 20px #ff2e88;
padding:15px 35px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
}

#no{
position:absolute;
left:60%;
background:#222;
color:white;
padding:15px 35px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
}

/* MENSAJES */
.messageBox{
position:fixed;
background:#111;
padding:40px;
border-radius:25px;
border:3px solid #ff2e88;
z-index:9999;
font-size:22px;
max-width:300px;
box-shadow:0 0 30px #ff2e88;
animation:float 3s ease-in-out infinite alternate;
will-change: transform;
}

@keyframes float{
from{transform:translateY(0px);}
to{transform:translateY(20px);}
}

.closeBtn{
position:absolute;
top:10px;
right:15px;
background:none;
border:none;
color:white;
font-size:20px;
cursor:pointer;
}

/* CORAZONES */
.shootingHeart{
position:fixed;
font-size:20px;
z-index:2;
animation:shoot 4s linear forwards;
text-shadow:0 0 20px #ff4da6;
}

@keyframes shoot{
0%{transform:translate(0,0); opacity:1;}
100%{transform:translate(-800px,800px); opacity:0;}
}

/* SI GIGANTE */
.bigYes{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:65px;
background:#ff2e88;
padding:50px 90px;
border-radius:50px;
z-index:10000;
animation:heartbeat 1s infinite;
box-shadow:0 0 40px #ff2e88;
cursor:pointer;
}

@keyframes heartbeat{
0%{transform:translate(-50%,-50%) scale(1);}
50%{transform:translate(-50%,-50%) scale(1.15);}
100%{transform:translate(-50%,-50%) scale(1);}
}

#countdown{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:35px;
text-shadow:0 0 20px #ff2e88;
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="container" id="mainContent">
<h1>
Michelina ❤️<br>
¿Quieres celebrar San Valentín<br>
con tu negro? ❤️
</h1>

<div class="buttons">
<button id="yes">Sí ❤️</button>
<button id="no">No ❌</button>
</div>
</div>

<script>

/* LIMPIAR PANTALLA SIN ROMPER TODO */
function clearScreen(){
document.body.innerHTML="<div class='stars'></div>";
}

/* CORAZONES OPTIMIZADOS */
function createHeart(){
let heart=document.createElement("div");
heart.className="shootingHeart";
heart.innerHTML="💖";
heart.style.left=Math.random()*window.innerWidth+"px";
heart.style.top=Math.random()*window.innerHeight/2+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),4000);
}

let heartInterval=setInterval(createHeart,1000);

/* FRASES */
let warnings=[
"¿Segura?",
"Imposible...",
"Que no pesadaaa",
"Casi casi",
"No puedes escapar",
"Última advertencia",
"Error 404"
];

let count=0;
let activeMessages=0;

const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");

noBtn.addEventListener("click",()=>{

if(count < warnings.length){

let box=document.createElement("div");
box.className="messageBox";
box.innerHTML=`<button class="closeBtn">X</button>${warnings[count]}`;

box.style.top=Math.random()*(window.innerHeight-200)+"px";
box.style.left=Math.random()*(window.innerWidth-300)+"px";

document.body.appendChild(box);
activeMessages++;

box.querySelector(".closeBtn").onclick=()=>{
box.remove();
activeMessages--;

if(warnings[count-1]==="Error 404" && activeMessages===0){
showBigYes();
}
};

noBtn.style.top=Math.random()*(window.innerHeight-100)+"px";
noBtn.style.left=Math.random()*(window.innerWidth-150)+"px";

count++;
}

});

/* BOTÓN SÍ */
yesBtn.addEventListener("click",showLoveMessage);

function showBigYes(){
clearInterval(heartInterval);
clearScreen();
let big=document.createElement("div");
big.className="bigYes";
big.innerText="SÍ ❤️";
document.body.appendChild(big);
big.addEventListener("click",showLoveMessage);
}

function showLoveMessage(){
clearInterval(heartInterval);
clearScreen();

let message=document.createElement("div");
message.id="countdown";
message.innerHTML="Sabía que ibas a decir que sí ❤️";
document.body.appendChild(message);

setTimeout(startCountdown,3000);
}

/* CUENTA ATRÁS CORRECTA */
function startCountdown(){
clearScreen();

let countdown=document.createElement("div");
countdown.id="countdown";
document.body.appendChild(countdown);

let now=new Date();
let target=new Date(now.getFullYear(),1,14,14,0,0);

if(now>target){
target=new Date(now.getFullYear()+1,1,14,14,0,0);
}

function update(){
let distance=target - new Date().getTime();

if(distance<=0){
countdown.innerHTML="Espera impaciente ❤️";
return;
}

let d=Math.floor(distance/(1000*60*60*24));
let h=Math.floor((distance%(1000*60*60*24))/(1000*60*60));
let m=Math.floor((distance%(1000*60*60))/(1000*60));
let s=Math.floor((distance%(1000*60))/1000);

countdown.innerHTML=d+"d "+h+"h "+m+"m "+s+"s ❤️";
}

setInterval(update,1000);
update();
}

</script>

</body>
</html>
