<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Michelina ❤</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            text-align: center;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
        }

        /* Estrellas estáticas */
        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(2px 2px at 20% 30%, white, transparent),
                        radial-gradient(1px 1px at 70% 80%, white, transparent),
                        radial-gradient(2px 2px at 40% 60%, white, transparent);
            background-size: 300px 300px;
            z-index: 0;
        }

        /* Estrellas fugaces de corazones */
        .shooting-heart {
            position: absolute;
            color: #ff4da6;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: shoot 4s linear infinite;
            opacity: 0;
        }

        @keyframes shoot {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            100% { transform: translate(800px, 800px) rotate(360deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 5;
            top: 20vh;
        }

        h1 {
            font-size: 28px;
            text-shadow: 0 0 20px #ff4da6;
            padding: 0 20px;
        }

        .buttons {
            margin-top: 30px;
            position: relative;
            display: inline-block;
        }

        #yes, #no {
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #yes {
            background: #ff2e88;
            color: white;
            box-shadow: 0 0 20px #ff2e88;
        }

        #no {
            background: #444;
            color: white;
            margin-left: 10px;
        }

        .messageBox {
            position: fixed;
            background: rgba(17, 17, 17, 0.9);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #ff2e88;
            z-index: 9999;
            color: white;
            box-shadow: 0 0 15px #ff2e88;
        }

        .confetti {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div id="shooting-container"></div>

    <div class="container" id="main-content">
        <h1>Michelina ❤<br>¿Quieres celebrar San Valentín conmigo?</h1>
        <div class="buttons">
            <button id="yes">¡Sí! ❤</button>
            <button id="no">No ❌</button>
        </div>
    </div>

    <script>
        const warnings = ["¿Segura?", "¡Inténtalo de nuevo!", "Imposible...", "Casi lo tienes", "¡Ups!", "No puedes escapar", "Error 404"];
        let count = 0;

        // Generador de estrellas fugaces (corazones)
        function createShootingHeart() {
            const container = document.getElementById('shooting-container');
            const heart = document.createElement('div');
            heart.className = 'shooting-heart';
            heart.innerHTML = '❤';
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.top = Math.random() * -100 + 'px';
            heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }
        setInterval(createShootingHeart, 1000);

        const noBtn = document.getElementById("no");
        const yesBtn = document.getElementById("yes");

        noBtn.addEventListener("click", () => {
            if (count < warnings.length) {
                let box = document.createElement("div");
                box.className = "messageBox";
                box.innerHTML = warnings[count];
                box.style.left = Math.random() * (window.innerWidth - 150) + "px";
                box.style.top = Math.random() * (window.innerHeight - 100) + "px";
                document.body.appendChild(box);
                
                setTimeout(() => box.remove(), 2000);

                // Mover el botón NO
                noBtn.style.position = "fixed";
                noBtn.style.left = Math.random() * (window.innerWidth - 100) + "px";
                noBtn.style.top = Math.random() * (window.innerHeight - 60) + "px";
                count++;
            }
        });

        yesBtn.onclick = () => {
            document.body.innerHTML = `
                <div class="stars"></div>
                <div style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:100%;">
                    <h1 style="font-size:40px; color:#ff2e88; text-shadow: 0 0 20px #ff2e88;">
                        ¡FELIZ SAN VALENTÍN AMOR! ❤
                    </h1>
                </div>
            `;
            createConfetti();
        };

        function createConfetti() {
            for(let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const c = document.createElement("div");
                    c.className = "confetti";
                    c.innerText = "❤";
                    c.style.left = Math.random() * 100 + "vw";
                    c.style.top = "-5vh";
                    c.style.color = "#ff2e88";
                    c.style.fontSize = (Math.random() * 20 + 20) + "px";
                    c.style.animationDuration = (Math.random() * 3 + 2) + "s";
                    document.body.appendChild(c);
                }, i * 50);
            }
        }
    </script>
</body>
</html>
