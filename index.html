<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Michelina 💖</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial, sans-serif;
background:black;
color:white;
text-align:center;
}

/* Fondo galaxia */
body::before{
content:"";
position:fixed;
width:200%;
height:200%;
background:radial-gradient(white 1px, transparent 1px);
background-size:40px 40px;
animation:moveStars 60s linear infinite;
opacity:0.2;
}

@keyframes moveStars{
from{transform:translate(0,0);}
to{transform:translate(-500px,-500px);}
}

.container{
position:relative;
top:30vh;
z-index:2;
}

button{
padding:15px 30px;
font-size:18px;
margin:10px;
border:none;
border-radius:30px;
cursor:pointer;
transition:0.3s;
}

#yes{
background:#ff4d88;
color:white;
}

#no{
background:#444;
color:white;
position:relative;
}

.bigYes{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:60px;
background:#ff1a75;
padding:40px 80px;
border-radius:50px;
animation:heartbeat 1s infinite;
}

@keyframes heartbeat{
0%{transform:translate(-50%,-50%) scale(1);}
25%{transform:translate(-50%,-50%) scale(1.1);}
50%{transform:translate(-50%,-50%) scale(1);}
75%{transform:translate(-50%,-50%) scale(1.15);}
100%{transform:translate(-50%,-50%) scale(1);}
}

.messageBox{
position:fixed;
top:40%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:20px;
border-radius:20px;
border:2px solid #ff4d88;
}

.closeBtn{
position:absolute;
top:5px;
right:10px;
cursor:pointer;
font-weight:bold;
}
</style>
</head>

<body>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_6bfe6b3d9d.mp3?filename=romantic-saxophone-110918.mp3" type="audio/mpeg">
</audio>

<div class="container" id="main">
<h1>Michelina... 💖<br>¿Quieres celebrar San Valentín conmigo?</h1>
<button id="yes">Sí ❤️</button>
<button id="no">No ❌</button>
</div>

<script>

const music = document.getElementById("music");
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");

let warnings = [
"⚠️ ¿Estás segura? Esto puede ser MUY romántico...",
"🚨 Advertencia: riesgo alto de besos",
"💥 Peligro: abrazos ilimitados",
"❌ Última oportunidad...",
"🖤 Error 404: opción 'No' no encontrada"
];

let clickCount = 0;

noBtn.addEventListener("click", () => {

if(navigator.vibrate) navigator.vibrate([200,100,200]);

if(clickCount < warnings.length){

let box = document.createElement("div");
box.className="messageBox";
box.innerHTML=`<span class="closeBtn">X</span><p>${warnings[clickCount]}</p>`;
document.body.appendChild(box);

box.querySelector(".closeBtn").onclick=()=>{
box.remove();
};

noBtn.style.transform=`scale(${1 - clickCount*0.1})`;
noBtn.style.position="absolute";
noBtn.style.top=Math.random()*80+"%";
noBtn.style.left=Math.random()*80+"%";

clickCount++;

}else{

document.body.innerHTML="";
let big = document.createElement("div");
big.className="bigYes";
big.innerText="SÍ ❤️";
document.body.appendChild(big);

if(navigator.vibrate) navigator.vibrate([300,100,300,100,500]);

}
});

yesBtn.addEventListener("click", () => {

music.play();

if(navigator.vibrate) navigator.vibrate([100,50,100,50,300]);

document.getElementById("main").innerHTML="<h1>Sabía que dirías que sí... ❤️</h1>";

createConfetti();

});

function createConfetti(){
for(let i=0;i<50;i++){
let heart=document.createElement("div");
heart.innerHTML="💖";
heart.style.position="fixed";
heart.style.left=Math.random()*100+"%";
heart.style.top="-10px";
heart.style.fontSize=Math.random()*20+20+"px";
heart.style.animation=`fall ${Math.random()*3+2}s linear`;
document.body.appendChild(heart);

setTimeout(()=>heart.remove(),5000);
}
}

const style=document.createElement('style');
style.innerHTML=`
@keyframes fall{
to{transform:translateY(100vh);}
}
`;
document.head.appendChild(style);

</script>

</body>
</html>
